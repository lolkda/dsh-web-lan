# 发布到 npm：打 v* 标签即发布，也可手动触发（workflow_dispatch）重跑。
#
# 一次发布只有一条路径：测试 → 闸门 → 打包 → 留档 → 发布刚打出来的那个 tarball。
# 发布的正是 CI 里跑过测试、并已上传 artifact 的那个文件 —— 不存在"发布时重新打一次包"
# 导致发布的字节与验证过的字节不一致的可能。
#
# 闸门逻辑在 scripts/release.mjs（有单测，见 test/release.test.js），不写在 YAML 里：
#   1. 测试必须过（npm run check），发生在打包之前
#   2. 标签版本必须等于 package.json 的 version（打错标签不会静默发错版本）
#   3. 该版本若已存在则拒绝（npm 的同一版本不可覆盖，早失败比等 npm 报错清楚）
#   4. dist-tag 由版本决定：0.2.0-rc.1 这类预发布走 next，只有正式版走 latest。
#      npm ≥ 11 对预发布强制要求显式 --tag（"You must specify a tag using --tag when
#      publishing a prerelease version."），缺了直接报错；而若给它 latest，就会让 rc
#      通过 `dsh plugin add @lolkda/dsh-web-lan` 发给所有人。
#
# 凭据走 npm Trusted Publishing（OIDC）：仓库里没有任何长期 token，下面两步用 GitHub 的
# 短时 id-token 跟 npm 换取一次性的发布凭据。前提是先在 npmjs.com 的包设置里登记本工作流：
#
#   npmjs.com → @lolkda/dsh-web-lan → Settings → Trusted Publisher → GitHub Actions
#     Organization or user: lolkda
#     Repository:           dsh-web-lan
#     Workflow filename:    publish.yml      （只写文件名，不要路径；必须与 .github/workflows/ 下一致）
#     Environment name:    留空
#     Allowed actions:     勾上直接发布（npm publish）；只勾 stage publish 的话这里会 E401
#
# 没登记就去发的话，npm publish 会以 ENEEDAUTH 失败 —— 那是配置缺失，不是脚本问题。
# 顺带一提：npm 侧还有 "Require two-factor authentication and disallow tokens" 这个开关，
# 打开后连长期 token 都不能发布，配合本工作流正好把仓库里最后一份可长期使用的凭据去掉。
name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# contents: read 是最小读权限；id-token: write 是 OIDC 的来源，没有它 npm 拿不到
# 一次性凭据，--provenance 也无从签名。
permissions:
  contents: read
  id-token: write

# 同一个 ref 上的发布串行化：避免两个 run 同时走到 npm publish，白烧一次失败。
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 故意不传 registry-url：那是给长期 token 用的（它会在 .npmrc 里写一行
      # ${NODE_AUTH_TOKEN}），而 OIDC 发布不需要、也不该有 .npmrc 里的 token。
      # registry 在 publish / view 上显式指定。
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 运行时零依赖；测试安装锁定的 Cordis 与官方设置模块验证真实插件生命周期。
      - name: Install test dependencies
        run: npm ci --ignore-scripts

      - name: Test
        run: npm run check

      # 三道闸门 + dist-tag 决策。手动触发时没有标签，只跳过标签校验，其余照旧。
      - name: Release gate
        id: gate
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          published="$(npm view "${name}" versions --json 2>/dev/null || echo '[]')"
          tag=""
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then tag="${GITHUB_REF_NAME}"; fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          node scripts/release.mjs --version "${version}" --tag "${tag}" --published "${published}" >> "$GITHUB_OUTPUT"

      # 只打一次包，后面发布的就是它。npm 不会自己创建 --pack-destination 目录。
      - name: Pack
        id: pack
        run: |
          set -euo pipefail
          mkdir -p dist
          npm pack --pack-destination dist
          tarball="$(ls dist/*.tgz)"
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"

      # 留档：产物可下载、可复现，事后能跟 registry 上的文件比对。
      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: dist/*.tgz

      # Trusted Publishing 要求 npm CLI ≥ 11.5.1（Node ≥ 22.14.0），而 runner 上
      # Node 22 自带的是 npm 10.x —— 它不认识 OIDC，会直接 ENEEDAUTH。
      - name: Use an npm that can do trusted publishing
        run: |
          set -euo pipefail
          npm install -g 'npm@^11.5.1'
          npm --version

      - name: Publish
        run: |
          set -euo pipefail
          # "./" 前缀不能省：npm 会把裸的 dist/x.tgz 当成 GitHub 简写（owner/repo）去 ls-remote。
          # --registry 显式指定：对 tarball 形式的 spec，npm 不读 publishConfig.registry，
          # 只认 .npmrc/命令行；顺带保证 OIDC 的 audience 是 npm:registry.npmjs.org。
          npm publish "./${{ steps.pack.outputs.tarball }}" \
            --tag "${{ steps.gate.outputs.npm-tag }}" \
            --access public \
            --provenance \
            --registry=https://registry.npmjs.org/

      - name: Verify
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="${{ steps.gate.outputs.version }}"
          npm_tag="${{ steps.gate.outputs.npm-tag }}"
          npm view "${name}@${version}" version --registry=https://registry.npmjs.org/
          {
            echo "### published \`${name}@${version}\`"
            echo
            echo "- dist-tag: \`${npm_tag}\`"
            echo "- tarball: \`${{ steps.pack.outputs.tarball }}\`（本 run 的 artifact：npm-package）"
            echo "- 用法：\`dsh plugin --profile web add ${name}@${version}\`"
          } >> "$GITHUB_STEP_SUMMARY"
